name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build_wheels:
    name: Build wheels (manylinux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cibuildwheel itself runs via pipx inside the action
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # ВАЖНО: ограничиваем версии CPython, чтобы не выпускать "случайно" cp314
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # Только x86_64 (можно расширить позже)
          CIBW_ARCHS_LINUX: "x86_64"
          # Опционально: отключить прогон тестов (по умолчанию их и нет)
          # CIBW_TEST_SKIP: "*"

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels
          path: wheelhouse/*.whl

  make_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/owrf1d

    permissions:
      id-token: write  # обязательно для Trusted Publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
